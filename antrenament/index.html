<!DOCTYPE html>
<html lang="ro">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#F2F3F6">
<meta name="description" content="Jurnal de antrenament — trepte de greutate, serii, recorduri.">
<title>Sala — jurnal de antrenament</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sala">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gabarito:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAF8FB;
  --card:#FFFFFF;
  --ink:#232734;
  --ink-2:#3D4353;
  --muted:#8B90A0;
  --muted-2:#AAAEBC;
  --line:#F1F0F5;
  --wash:#F5F4F9;
  --pink:#E79DC3;
  --pink-s:#FBEDF4;
  --pink-d:#B4587C;
  --yellow:#FCEA95;
  --yellow-s:#FEF8DE;
  --mint:#90C9AE;
  --mint-s:#E8F4EE;
  --slate:#536583;
  --slate-s:#E8EBF1;
  --go:linear-gradient(105deg,#9ACFB4 0%,#C6E2A6 55%,#F6E79A 100%);
  --disp:'Gabarito','Plus Jakarta Sans',system-ui,sans-serif;
  --body:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:26px;
  --sh:0 1px 2px rgba(83,101,131,.04), 0 10px 28px -14px rgba(83,101,131,.30);
  --sh-l:0 2px 6px rgba(83,101,131,.05), 0 18px 40px -18px rgba(83,101,131,.38);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);
  font-size:16px;line-height:1.45;letter-spacing:-.005em;
  padding-bottom:calc(160px + env(safe-area-inset-bottom));overscroll-behavior-y:none}
button,input{font-family:inherit;color:inherit;font-size:inherit}
button{border:0;background:none;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:40;
  background:linear-gradient(var(--paper) 74%,rgba(250,248,251,0));
  padding:calc(14px + env(safe-area-inset-top)) 0 12px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.htitle{font-family:var(--disp);font-weight:800;font-size:26px;letter-spacing:-.035em;line-height:1}
.hsub{font-size:11.5px;color:var(--muted);font-weight:600;background:var(--card);
  padding:7px 13px;border-radius:999px;box-shadow:var(--sh);white-space:nowrap}
.hsub:empty{display:none}
.mark-hl{background:var(--yellow);border-radius:7px;padding:0 7px;box-decoration-break:clone}

/* ---------- carduri ---------- */
.card{background:var(--card);border-radius:var(--r);margin-bottom:14px;
  overflow:hidden;box-shadow:var(--sh)}
.card-h{display:flex;align-items:center;gap:13px;padding:17px 17px 14px}
.card-h h3{margin:0;font-size:16.5px;font-weight:700;line-height:1.25;flex:1;letter-spacing:-.02em}
.last{font-size:12.5px;color:var(--muted);margin-top:4px;font-weight:500;font-variant-numeric:tabular-nums}
.gicon{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center}
.gicon svg{width:23px;height:23px;stroke:var(--ink);fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.g0{background:var(--mint-s)}.g1{background:var(--pink-s)}.g2{background:var(--slate-s)}
.g3{background:var(--yellow-s)}.g4{background:#EFEAF7}.g5{background:#FCEDE4}.g6{background:var(--wash)}
.kebab{width:36px;height:36px;border-radius:50%;color:var(--muted-2);flex:none;
  display:grid;place-items:center;font-size:19px}
.kebab:active{background:var(--wash)}
.tutbtn{background:var(--mint-s);color:var(--ink)}
.tutbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linejoin:round}
.card-h{gap:9px}

/* ---------- trepte ---------- */
.step{display:flex;gap:12px;padding:12px 17px 12px 12px;align-items:flex-start}
.step+.step{border-top:1px solid var(--line)}
.rail{width:5px;border-radius:999px;flex:none;align-self:stretch;background:var(--wash);min-height:44px}
.rail.p1{background:var(--mint)}.rail.p2{background:var(--yellow)}
.rail.p3{background:var(--pink)}.rail.p4{background:var(--slate)}
.stepbody{flex:1;min-width:0}
.wt{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.wtnum{font-family:var(--disp);font-size:27px;font-weight:800;line-height:1;letter-spacing:-.055em;
  min-width:66px;text-align:center;padding:3px 5px;border-radius:13px;font-variant-numeric:tabular-nums}
.wtnum:active{background:var(--wash)}
.unit{font-size:11px;color:var(--muted-2);font-weight:700;margin-left:-5px}
.rnd{width:40px;height:40px;border-radius:50%;background:var(--wash);
  display:grid;place-items:center;font-size:21px;font-weight:600;color:var(--ink-2);flex:none;line-height:0}
.rnd:active{background:var(--mint);transform:scale(.92)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{min-width:50px;height:42px;padding:0 12px;border-radius:15px;background:var(--wash);
  font-family:var(--disp);font-size:17px;font-weight:700;letter-spacing:-.04em;
  display:grid;place-items:center;font-variant-numeric:tabular-nums}
.chip.on{background:var(--mint);color:#1E3A2C}
.chip.rec{box-shadow:inset 0 0 0 2px var(--pink)}
.chip.add{color:var(--muted);font-size:20px;background:none;box-shadow:inset 0 0 0 1.5px var(--line)}
.editbar{display:flex;align-items:center;gap:10px;margin-top:11px;padding:8px;
  border-radius:19px;background:var(--mint-s)}
.editbar .lbl{flex:1;font-size:11.5px;color:#3B6353;letter-spacing:.05em;text-transform:uppercase;font-weight:800}
.editbar .rnd{background:#fff}
.del{width:40px;height:40px;border-radius:50%;color:var(--pink-d);display:grid;place-items:center;font-size:16px}
.addstep{display:block;width:100%;text-align:left;padding:14px 17px 16px;
  border-top:1px solid var(--line);color:var(--muted);font-size:13.5px;font-weight:700}
.addstep:active{background:var(--wash)}

/* ---------- butoane ---------- */
.btn{display:block;width:100%;padding:17px;border-radius:999px;background:var(--go);color:var(--ink);
  font-weight:800;font-size:15.5px;text-align:center;letter-spacing:-.015em;
  box-shadow:0 8px 20px -10px rgba(122,168,140,.9)}
.btn:active{transform:translateY(1px);filter:brightness(.97)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.btn.quiet{background:none;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--muted)}
.btn.danger{background:var(--pink-s);color:var(--pink-d);box-shadow:none}
.btn[disabled]{opacity:.55}

/* ---------- gol ---------- */
.empty{text-align:center;padding:26px 20px 30px}
.empty .big{font-family:var(--disp);font-size:21px;font-weight:800;letter-spacing:-.04em;
  margin-bottom:8px;line-height:1.2}
.empty p{margin:0 0 18px;font-size:14px;color:var(--muted);font-weight:500}

/* ---------- citat ---------- */
.quote{border-radius:var(--r);padding:22px 20px 18px;margin-bottom:14px;position:relative;
  background:var(--yellow);overflow:hidden;box-shadow:var(--sh)}
.quote.c1{background:var(--pink)}.quote.c2{background:var(--mint)}.quote.c3{background:var(--yellow)}
.quote .mark{position:absolute;right:12px;top:-18px;font-family:var(--disp);font-size:96px;
  font-weight:800;color:rgba(35,39,52,.09);line-height:1;user-select:none;pointer-events:none}
.quote .q{font-family:var(--disp);font-size:18px;font-weight:800;letter-spacing:-.035em;
  line-height:1.3;position:relative;z-index:1;padding-right:22px}
.quote .day{font-size:11px;font-weight:700;color:rgba(35,39,52,.5);margin-top:13px}

/* ---------- bara de jos ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:50;padding:22px 0 calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(rgba(250,248,251,0),var(--paper) 34px);pointer-events:none}
.dock>*{pointer-events:auto}
.rest{margin:0 auto 9px;max-width:528px;display:flex;align-items:center;gap:11px;
  background:var(--card);border-radius:999px;padding:10px 10px 10px 18px;box-shadow:var(--sh-l)}
.rest.done{background:var(--mint)}
.rest .t{font-family:var(--disp);font-size:20px;font-weight:800;letter-spacing:-.05em;
  font-variant-numeric:tabular-nums;line-height:1}
.rest .lbl{flex:1;font-size:11.5px;color:var(--muted);font-weight:700}
.rest.done .lbl{color:#2C4A3B}
.rest button{font-size:12.5px;font-weight:800;color:var(--ink-2);padding:9px 12px;
  background:var(--wash);border-radius:999px}
.rest.done button{background:rgba(255,255,255,.55)}
.dockmain{max-width:528px;margin:0 auto;display:flex;gap:9px;padding:0 16px 10px}
.dockmain>*{flex:1}
nav{display:flex;align-items:center;justify-content:center;gap:2px;margin:0 auto;
  background:var(--card);border-radius:999px;padding:7px;box-shadow:var(--sh-l);width:fit-content;max-width:calc(100% - 32px)}
nav button{width:42px;height:42px;border-radius:999px;color:var(--muted-2);flex:none;
  display:flex;align-items:center;justify-content:center;gap:7px;overflow:hidden;
  transition:width .18s ease, background .18s ease}
nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round;flex:none}
@media (max-width:359px){
  nav button.on{width:42px;padding:0}
  nav button.on span{display:none}
}
nav button span{display:none;font-size:12.5px;font-weight:800;letter-spacing:-.02em}
nav button.on{background:var(--go);color:var(--ink);width:auto;padding:0 15px 0 11px}
nav button.on span{display:block}
.pending{max-width:528px;margin:0 auto 9px;display:flex;align-items:center;gap:9px;
  background:var(--pink);border-radius:999px;padding:11px 18px;font-size:12.5px;
  font-weight:700;color:#4A2237;box-shadow:var(--sh)}

/* ---------- foaie modală ---------- */
.scrim{position:fixed;inset:0;background:rgba(35,39,52,.34);z-index:60;
  display:flex;align-items:flex-end;justify-content:center;animation:fade .16s ease;backdrop-filter:blur(3px)}
.sheet{background:var(--paper);width:100%;max-width:560px;border-radius:30px 30px 0 0;
  max-height:88vh;display:flex;flex-direction:column;animation:up .22s cubic-bezier(.2,.8,.3,1);
  padding-bottom:env(safe-area-inset-bottom)}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
@keyframes fade{from{opacity:0}}
.grab{width:44px;height:5px;background:var(--line);border-radius:99px;margin:11px auto 4px;flex:none}
.sheet h2{font-family:var(--disp);font-size:19px;letter-spacing:-.04em;margin:10px 20px 14px;font-weight:800}
.sheet .scroll{overflow-y:auto;padding:0 14px 16px;-webkit-overflow-scrolling:touch}
.srch{width:100%;padding:16px 18px;border-radius:999px;background:var(--card);
  border:0;margin:0 0 12px;outline:none;font-weight:600;box-shadow:var(--sh)}
.srch:focus{box-shadow:var(--sh),0 0 0 2px var(--mint)}
.grouplbl{font-size:11px;color:var(--muted-2);letter-spacing:.08em;text-transform:uppercase;
  font-weight:800;margin:18px 8px 9px}
.pick{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;
  border-radius:22px;background:var(--card);margin-bottom:8px;box-shadow:var(--sh)}
.pick:active{background:var(--mint-s)}
.pick .nm{flex:1;font-size:15px;font-weight:700;line-height:1.25;letter-spacing:-.02em}
.pick .mt{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:3px;font-weight:500}
.pick .go{color:var(--muted-2);font-size:19px}

/* ---------- istoric ---------- */
.sess{padding:17px 17px 14px}
.sess .d{font-family:var(--disp);font-size:17px;font-weight:800;letter-spacing:-.04em}
.sess .m{font-size:12.5px;color:var(--muted);margin-top:3px;font-weight:500;font-variant-numeric:tabular-nums}
.line{font-size:14px;padding:9px 0;border-top:1px solid var(--line);display:flex;gap:10px}
.line .n{flex:1;min-width:0;font-weight:600}
.line .v{color:var(--muted);font-size:13px;font-weight:500;font-variant-numeric:tabular-nums;
  text-align:right;flex:none;max-width:52%}

/* ---------- statistici / grafice ---------- */
.stats{display:flex;gap:10px;margin-bottom:14px}
.stat{flex:1;border-radius:22px;padding:15px 13px;box-shadow:var(--sh)}
.stat:nth-child(1){background:var(--pink)}
.stat:nth-child(2){background:var(--yellow)}
.stat:nth-child(3){background:var(--mint)}
.stat .v{font-family:var(--disp);font-size:25px;font-weight:800;line-height:1;
  letter-spacing:-.055em;font-variant-numeric:tabular-nums;color:var(--ink)}
.stat .k{font-size:10.5px;font-weight:700;margin-top:7px;color:rgba(35,39,52,.55)}
.chart{padding:16px 14px 10px}
svg.ch{width:100%;height:148px;display:block;overflow:visible}
.recbadge{display:inline-flex;align-items:center;gap:4px;background:var(--pink);
  color:#4A2237;border-radius:999px;padding:4px 11px;font-size:10.5px;font-weight:800}
.week{padding:18px 18px 16px}
.week .top{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.week .n{font-family:var(--disp);font-size:32px;font-weight:800;letter-spacing:-.06em;line-height:.95}
.week .n small{font-size:14px;font-weight:700;color:var(--muted);letter-spacing:-.02em}
.week .lbl{font-size:11.5px;color:var(--muted);font-weight:700}
.bars{display:flex;align-items:flex-end;gap:7px;height:78px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:7px}
.bars i{display:block;border-radius:999px;background:var(--wash);min-height:7px}
.bars b{font-size:10px;font-weight:700;color:var(--muted-2);text-align:center;font-style:normal}
.bars .on i{background:var(--go)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:200px;z-index:90;
  background:var(--ink);color:#fff;padding:13px 20px;border-radius:999px;font-weight:700;
  font-size:14px;box-shadow:0 12px 30px rgba(35,39,52,.3)}
.hint{font-size:12.5px;color:var(--muted-2);text-align:center;padding:8px 14px 16px;
  line-height:1.55;font-weight:500}
.cardh{font-family:var(--disp);font-size:16.5px;font-weight:800;letter-spacing:-.03em;margin:2px 2px 10px}
.delta{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;
  padding:4px 10px;border-radius:999px;white-space:nowrap}
.delta.up{background:var(--mint-s);color:#2E6B52}
.delta.down{background:var(--pink-s);color:var(--pink-d)}
.delta.flat{background:var(--wash);color:var(--muted)}
svg rect.b0{fill:var(--wash)}
svg rect.b1{fill:url(#gbar)}
svg text.bl{fill:var(--muted-2)}
.advrow{display:flex;gap:11px;align-items:flex-start;padding:11px 2px;border-top:1px solid var(--line)}
.advrow:first-of-type{border-top:0}
.advrow .dot{width:9px;height:9px;border-radius:50%;margin-top:5px;flex:none}
.advrow .nm2{font-size:14.5px;font-weight:700;letter-spacing:-.02em}
.advrow .tg{font-size:10.5px;font-weight:800;padding:2px 9px;border-radius:999px;white-space:nowrap}
.advrow .tp{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.45}
.ptab{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.ptab th{font-size:10px;font-weight:800;color:var(--muted-2);text-align:right;padding:3px 5px;
  text-transform:uppercase;letter-spacing:.04em}
.ptab th:first-child{text-align:left}
.ptab td{font-size:13px;font-weight:600;text-align:right;padding:8px 5px;border-top:1px solid var(--line)}
.ptab td:first-child{text-align:left;font-weight:700}

/* ---------- profil ---------- */
.hero{display:flex;align-items:center;gap:16px;padding:20px 18px}
.avring{position:relative;width:78px;height:78px;flex:none}
.avring svg{position:absolute;inset:0}
.av{position:absolute;inset:7px;border-radius:50%;display:grid;place-items:center;
  font-size:29px;background:var(--yellow-s);overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.avpct{position:absolute;right:-6px;bottom:-2px;background:var(--card);border-radius:999px;
  padding:3px 8px;font-size:10.5px;font-weight:800;box-shadow:var(--sh);
  font-variant-numeric:tabular-nums;color:var(--ink)}
.pen{position:absolute;right:-4px;top:-2px;width:25px;height:25px;border-radius:50%;
  background:var(--ink);color:#fff;display:grid;place-items:center;font-size:11px}
.hname{font-family:var(--disp);font-size:21px;font-weight:800;letter-spacing:-.045em;line-height:1.12}
.hmeta{font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.5;font-weight:500}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.tile{border-radius:22px;padding:16px 15px;box-shadow:var(--sh);background:var(--card)}
.tile .v{font-family:var(--disp);font-size:23px;font-weight:800;letter-spacing:-.06em;
  line-height:1;font-variant-numeric:tabular-nums}
.tile .k{font-size:10.5px;font-weight:700;margin-top:7px;color:var(--muted)}
.tile.pk{background:var(--pink)}.tile.yl{background:var(--yellow)}.tile.mn{background:var(--mint)}
.tile.sl{background:var(--slate)}
.tile.sl .v{color:#fff}.tile.sl .k{color:rgba(255,255,255,.7)}
.tile.pk .k,.tile.yl .k,.tile.mn .k{color:rgba(35,39,52,.55)}
.rowset{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:15px 17px;background:none}
.rowset+.rowset{border-top:1px solid var(--line)}
.rowset:active{background:var(--wash)}
.rowset .k{flex:1;font-size:14.5px;font-weight:600}
.rowset .v{font-size:14.5px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.rowset .go{color:var(--muted-2);font-size:17px}
.sect{font-size:11px;color:var(--muted-2);letter-spacing:.08em;text-transform:uppercase;
  font-weight:800;margin:22px 8px 10px}
.prrow{display:flex;align-items:center;gap:12px;padding:13px 17px}
.prrow+.prrow{border-top:1px solid var(--line)}
.prrow .rk{font-family:var(--disp);font-size:13px;font-weight:800;color:var(--muted-2);width:18px}
.prrow .nm{flex:1;font-size:14px;font-weight:600;line-height:1.25;min-width:0}
.prrow .kg{font-family:var(--disp);font-size:17px;font-weight:800;letter-spacing:-.05em;
  font-variant-numeric:tabular-nums}
.avpick{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:14px}
.avpick button{width:54px;height:54px;border-radius:50%;font-size:26px;background:var(--card);
  display:grid;place-items:center;box-shadow:var(--sh)}
.avpick button.on{background:var(--mint)}

/* ---------- autentificare ---------- */
.auth{max-width:430px;margin:0 auto;padding:9vh 22px 44px;min-height:100vh}
.logo{display:flex;gap:7px;margin-bottom:26px}
.logo i{width:38px;height:14px;border-radius:99px;display:block}
.auth h1{font-family:var(--disp);font-size:31px;font-weight:800;letter-spacing:-.05em;
  line-height:1.1;margin:0 0 12px}
.auth .sub{color:var(--muted);font-size:14.5px;line-height:1.6;margin:0 0 28px;font-weight:500}
.field{margin-bottom:11px}
.field label{display:block;font-size:11px;font-weight:800;color:var(--muted-2);margin:0 0 7px 18px}
.field input{width:100%;padding:17px 19px;border-radius:999px;background:var(--card);
  border:0;outline:none;font-weight:600;font-size:16px;box-shadow:var(--sh)}
.field input:focus{box-shadow:var(--sh),0 0 0 2px var(--mint)}
.swap{text-align:center;font-size:14px;color:var(--muted);padding:20px 0 0;font-weight:500}
.swap button{color:var(--ink);font-weight:800}
.msg{border-radius:20px;padding:14px 17px;font-size:13.5px;margin-bottom:14px;
  line-height:1.5;font-weight:600}
.msg.err{background:var(--pink-s);color:var(--pink-d)}
.msg.ok{background:var(--mint-s);color:#2C4A3B}
.setupwarn{max-width:520px;margin:0 auto;padding:9vh 22px}
.setupwarn code{background:var(--card);border-radius:8px;padding:3px 8px;font-size:13px;

function band(kg){ if(kg<10)return 0; if(kg<25)return 1; if(kg<40)return 2; if(kg<60)return 3; return 4; }
function exOf(id){ return S.ex.find(e=>e.id===id); }
function nameOf(it){ const e=exOf(it.exId); return e?e.name:"Exercițiu șters"; }
function dateRO(d){
  const x=new Date(d+"T12:00:00"), t=new Date(today()+"T12:00:00");
  const diff=Math.round((t-x)/864e5);
  if(diff===0) return "Azi"; if(diff===1) return "Ieri";
  return x.toLocaleDateString("ro-RO",{weekday:"short",day:"numeric",month:"long"});
}
function stepsText(steps){ return steps.filter(s=>s.reps.length).map(s=>fmt(s.kg)+" kg × "+s.reps.join(", ")).join("  ·  "); }
function best(exId,skip){
  let b=0;
  for(const s of S.sessions){ if(skip&&s.id===skip) continue;
    for(const it of s.items){ if(it.exId!==exId) continue;
      for(const st of it.steps) if(st.reps.length&&st.kg>b) b=st.kg; } }
  const e=exOf(exId);
  if(!b&&e&&e.ref) for(const st of e.ref) if(st.kg>b) b=st.kg;
  return b;
}
function lastDone(exId){
  for(let i=S.sessions.length-1;i>=0;i--){
    const it=S.sessions[i].items.find(x=>x.exId===exId&&x.steps.some(s=>s.reps.length));
    if(it) return {date:S.sessions[i].date,steps:it.steps};
  }
  const e=exOf(exId);
  return e&&e.ref&&e.ref.length?{date:null,steps:e.ref}:null;
}
function weekStart(d){ const x=new Date(d+"T12:00:00"); x.setDate(x.getDate()-((x.getDay()+6)%7));
  return new Date(x.getTime()-x.getTimezoneOffset()*6e4).toISOString().slice(0,10); }
function thisWeek(){ const w=weekStart(today()); return S.sessions.filter(s=>weekStart(s.date)===w).length; }
function streakWeeks(){
  const set=new Set(S.sessions.map(s=>weekStart(s.date)));
  let n=0, c=new Date(weekStart(today())+"T12:00:00");
  const key=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
  if(!set.has(key(c))) c.setDate(c.getDate()-7);
  while(set.has(key(c))){ n++; c.setDate(c.getDate()-7); }
  return n;
}
function volume(list){ return (list||S.sessions).reduce((t,s)=>t+s.items.reduce((a,i)=>
  a+i.steps.reduce((b,x)=>b+x.reps.reduce((c,r)=>c+r*x.kg,0),0),0),0); }
function prList(){
  const m={};
  S.sessions.forEach(s=>s.items.forEach(it=>it.steps.forEach(st=>{
    if(st.reps.length&&st.kg>(m[it.exId]||0)) m[it.exId]=st.kg; })));
  return Object.keys(m).map(id=>({id,kg:m[id],name:(exOf(id)||{}).name||"—"})).sort((a,b)=>b.kg-a.kg);
}
function age(){ if(!S.me.born) return null; const b=new Date(S.me.born+"T12:00:00"), n=new Date();
  let a=n.getFullYear()-b.getFullYear(); const m=n.getMonth()-b.getMonth();

function toast(m){

}
function buzz(p){ try{ navigator.vibrate&&navigator.vibrate(p); }catch(e){} }

/* pauză */
function startRest(){
  rest={left:S.me.rest||90,on:true}; clearInterval(restT);
  restT=setInterval(()=>{ rest.left--;
    if(rest.left<=0){ rest.left=0; clearInterval(restT); buzz([90,70,90]); beep(); }

function stopRest(){ clearInterval(restT); rest.on=false; renderDock(); }
function beep(){ try{
  const C=window.AudioContext||window.webkitAudioContext; if(!C) return;
  const c=new C(), o=c.createOscillator(), g=c.createGain();
  o.connect(g); g.connect(c.destination); o.frequency.value=760;
  g.gain.setValueAtTime(.001,c.currentTime);
  g.gain.exponentialRampToValueAtTime(.22,c.currentTime+.03);
  g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.5);
  o.start(); o.stop(c.currentTime+.52);
}catch(e){} }

/* ---- PROGRES ---- */
/* ---- analytics: perioade, forță estimată, recomandări ---- */
function vol1(v){ return v>=1000?fmt(v/1000)+" t":Math.round(v)+" kg"; }
function monthStart(d){ return d.slice(0,8)+"01"; }
function periodKey(d){ return progPer==="week"?weekStart(d):monthStart(d); }
function periodsSeq(n){
  const out=[], iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
  if(progPer==="week"){ let c=new Date(weekStart(today())+"T12:00:00");
    for(let k=0;k<n;k++){ out.unshift(iso(c)); c.setDate(c.getDate()-7); } }
  else{ let c=new Date(today()+"T12:00:00"); c.setDate(1);
    for(let k=0;k<n;k++){ out.unshift(iso(c)); c.setMonth(c.getMonth()-1); } }
  return out;
}
function periodLabel(k){ const x=new Date(k+"T12:00:00");
  return progPer==="week"
    ? x.toLocaleDateString("ro-RO",{day:"numeric",month:"short"}).replace(".","")
    : x.toLocaleDateString("ro-RO",{month:"short",year:"2-digit"}).replace("."," "); }
function periodTick(k){ const x=new Date(k+"T12:00:00");
  return progPer==="week"? String(x.getDate()) : x.toLocaleDateString("ro-RO",{month:"short"}).replace(".",""); }
function itemStat(it){ let topKg=0,e=0,reps=0,vol=0;
  it.steps.forEach(st=>{ if(!st.reps.length)return; if(st.kg>topKg)topKg=st.kg;
    st.reps.forEach(r=>{ vol+=r*st.kg; const x=st.kg*(1+r/30); if(x>e)e=x; reps+=r; }); });
  return topKg?{topKg,e1rm:Math.round(e*10)/10,reps,vol}:null; }
function topReps(it){ let topKg=0; it.steps.forEach(st=>{ if(st.reps.length&&st.kg>topKg)topKg=st.kg; });
  let mr=0; it.steps.forEach(st=>{ if(st.kg===topKg) st.reps.forEach(r=>{ if(r>mr)mr=r; }); }); return {topKg,mr}; }
function exSeries(exId){ const out=[];
  S.sessions.forEach(s=>{ const it=s.items.find(i=>i.exId===exId&&i.steps.some(x=>x.reps.length));
    if(it){ const st=itemStat(it); out.push({date:s.date,topKg:st.topKg,e1rm:st.e1rm,reps:st.reps,vol:st.vol,mr:topReps(it).mr}); } });
  return out; }
function exBestE1rm(exId){ return exSeries(exId).reduce((m,x)=>Math.max(m,x.e1rm),0); }
function exPeriods(exId){ const map={};
  S.sessions.forEach(s=>{ const it=s.items.find(i=>i.exId===exId&&i.steps.some(x=>x.reps.length)); if(!it)return;
    const k=periodKey(s.date), st=itemStat(it), m=map[k]||(map[k]={topKg:0,e1rm:0,reps:0,vol:0});
    m.topKg=Math.max(m.topKg,st.topKg); m.e1rm=Math.max(m.e1rm,st.e1rm); m.reps+=st.reps; m.vol+=st.vol; });
  return Object.keys(map).sort().map(k=>({k,...map[k]})); }
function exAdvice(exId){
  const ser=exSeries(exId); if(!ser.length) return null;
  const last=ser[ser.length-1], prev=ser[ser.length-2], name=(exOf(exId)||{}).name||"—";
  let stag=false;
  if(ser.length>=3){ const l3=ser.slice(-3); stag=l3.every(x=>x.topKg===last.topKg)&&l3[2].mr<=l3[0].mr; }
  let rank,tag,cls,tip;
  if(last.mr>=12){ rank=0; tag="Crește greutatea"; cls="up";
    tip=`${last.mr} repetări la ${fmt(last.topKg)} kg — ești gata de +2,5 kg data viitoare.`; }
  else if(prev&&last.e1rm>prev.e1rm*1.01){ rank=3; tag="În creștere"; cls="good";
    tip=`Forța urcă față de data trecută. Ține ${fmt(last.topKg)} kg până atingi 12 repetări, apoi crește.`; }
  else if(stag){ rank=1; tag="Stagnează"; cls="warn";
    tip=`3 antrenamente la ${fmt(last.topKg)} kg fără progres — adaugă 1 repetare, mai multă odihnă, sau variază exercițiul.`; }
  else if(prev&&last.e1rm<prev.e1rm*0.97){ rank=2; tag="În scădere"; cls="down";
    tip=`Sub nivelul trecut — verifică somnul, odihna între serii și tehnica.`; }
  else{ rank=4; tag="Constant"; cls="mut";
    tip=prev?`Aproape de data trecută — țintește +1 repetare.`:`Prima oară salvat — repetă-l ca să ai cu ce compara.`; }
  return {exId,name,last,prev,rank,tag,cls,tip};
}
function periodVol(){
  const keys=periodsSeq(progPer==="week"?8:6), map={};
  keys.forEach(k=>map[k]={vol:0,ses:0});
  S.sessions.forEach(s=>{ const k=periodKey(s.date); if(k in map){ map[k].vol+=volume([s]); map[k].ses++; } });
  return keys.map(k=>({k,vol:map[k].vol,ses:map[k].ses}));
}
function bars(data){
  const W=324,H=118,P=2,n=data.length,gap=7, bw=(W-2*P-gap*(n-1))/n,
    mx=Math.max(1,...data.map(d=>d.vol)); let r="";
  data.forEach((d,idx)=>{ const x=P+idx*(bw+gap), h=d.vol?Math.max(5,(d.vol/mx)*(H-26)):3, y=H-20-h;
    r+=`<rect class="${d.cur?"b1":"b0"}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="5"/>`;
    r+=`<text class="bl" x="${(x+bw/2).toFixed(1)}" y="${H-5}" text-anchor="middle" font-size="9.5" font-weight="700">${esc(d.label)}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Volum pe perioade">
    <defs><linearGradient id="gbar" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#9ACFB4"/><stop offset="1" stop-color="#F6E79A"/></linearGradient></defs>${r}</svg>`;
}

function viewProg(){
  const v=volume();
  const head=weekCard()+`<div class="stats">
    <div class="stat"><div class="v">${S.sessions.length}</div><div class="k">Sesiuni</div></div>

    <div class="stat"><div class="v">${v>=1000?Math.round(v/1000)+"t":Math.round(v)}</div><div class="k">Volum total</div></div></div>`;
  const used=S.ex.filter(e=>S.sessions.some(s=>s.items.some(i=>i.exId===e.id&&i.steps.some(x=>x.reps.length))));

    <p>Salvează un antrenament și vezi aici cum urcă greutatea.</p></div>`;
  return head+evoCard()+adviceCard(used)+exCard(used);
}
function evoCard(){
  const seq=periodVol(), cur=seq[seq.length-1], prev=seq[seq.length-2];
  const d=prev&&prev.vol?(cur.vol-prev.vol)/prev.vol*100:null;
  const dcls=d==null?"flat":(d>=2?"up":d<=-2?"down":"flat");
  const dtxt=d==null?"prima perioadă":`${d>0?"▲":d<0?"▼":"→"} ${Math.abs(Math.round(d))}% față de ${progPer==="week"?"săpt. trecută":"luna trecută"}`;
  const nowKey=periodKey(today());
  return `<div class="card" style="padding:16px 14px 13px">
    <div class="cardh">Evoluție volum</div>
    <div class="seg" style="margin-bottom:12px">
      <button data-act="progper" data-v="week" class="${progPer==="week"?"on":""}">Săptămânal</button>
      <button data-act="progper" data-v="month" class="${progPer==="month"?"on":""}">Lunar</button></div>
    ${bars(seq.map(p=>({label:periodTick(p.k),vol:p.vol,cur:p.k===nowKey})))}
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px">
      <div><div style="font-family:var(--disp);font-size:21px;font-weight:800;line-height:1">${vol1(cur.vol)}</div>
        <div style="font-size:11px;color:var(--muted);font-weight:600;margin-top:3px">${cur.ses} ${cur.ses===1?"antrenament":"antrenamente"} ${progPer==="week"?"săpt. asta":"luna asta"}</div></div>
      <span class="delta ${dcls}">${dtxt}</span></div></div>`;
}
function adviceCard(used){
  const list=used.map(e=>exAdvice(e.id)).filter(Boolean).sort((a,b)=>a.rank-b.rank);
  const TAG={up:["#E8F4EE","#2E6B52","#90C9AE"],warn:["#FEF8DE","#8A6D08","#FCEA95"],
    down:["#FBEDF4","#B4587C","#E79DC3"],good:["#E8EBF1","#3D4353","#536583"],mut:["#F0EFF5","#8B90A0","#C7CBD6"]};
  const rows=list.map(a=>{ const t=TAG[a.cls];
    return `<div class="advrow"><span class="dot" style="background:${t[2]}"></span>
      <div style="flex:1;min-width:0">
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <span class="nm2">${esc(a.name)}</span>
          <span class="tg" style="background:${t[0]};color:${t[1]}">${a.tag}</span></div>
        <div class="tp">${a.tip}</div></div></div>`; }).join("");
  return `<div class="card" style="padding:14px 14px 8px;margin-top:14px">
    <div class="cardh" style="margin-bottom:4px">Recomandări</div>
    <div style="font-size:12px;color:var(--muted);margin:0 2px 6px;line-height:1.45">Pe baza ultimelor antrenamente — unde să crești și ce stagnează.</div>
    ${rows}</div>`;
}
function exCard(used){
  const pick=S.progEx&&used.some(e=>e.id===S.progEx)?S.progEx:used[used.length-1].id;
  const mets=[["weight","Greutate"],["e1rm","Forță ~1RM"],["vol","Volum"]];
  return `<div class="cardh" style="margin:20px 2px 10px">Pe exercițiu</div>
    <button class="pick" data-act="pickprog" style="margin-bottom:10px">
      <div style="flex:1;min-width:0"><div class="nm">${esc(exOf(pick).name)}</div>
      <div class="mt">Record ${fmt(best(pick))} kg · forță ~1RM ${fmt(exBestE1rm(pick))} kg</div></div><span class="go">▾</span></button>
    <div class="seg" style="margin-bottom:12px">
      ${mets.map(m=>`<button data-act="progmet" data-v="${m[0]}" class="${progMetric===m[0]?"on":""}">${m[1]}</button>`).join("")}</div>
    <div class="card chart">${chartEx(pick)}</div>
    ${exTable(pick)}`;
}
function exTable(exId){
  const ps=exPeriods(exId); if(ps.length<2) return "";
  const show=ps.slice(-6).reverse();
  const rows=show.map((p,idx)=>{ const older=show[idx+1]; let arrow="";
    if(older){ const dd=p.e1rm-older.e1rm;
      arrow=dd>0.3?' <span style="color:#2E6B52">▲</span>':dd<-0.3?' <span style="color:var(--pink-d)">▼</span>':' <span style="color:var(--muted-2)">→</span>'; }
    return `<tr><td>${periodLabel(p.k)}</td><td>${fmt(p.topKg)}</td><td>${fmt(p.e1rm)}${arrow}</td><td>${p.reps}</td><td>${vol1(p.vol)}</td></tr>`; }).join("");
  return `<div class="card" style="padding:12px 12px 10px;margin-top:12px">
    <table class="ptab"><thead><tr><th>${progPer==="week"?"Săpt.":"Luna"}</th><th>Max</th><th>~1RM</th><th>Rep.</th><th>Volum</th></tr></thead>
    <tbody>${rows}</tbody></table>
    <div class="hint" style="padding:10px 4px 2px;text-align:left">~1RM = forța estimată pentru o singură repetare (din greutate × repetări). Urcă și când crești repetările, nu doar greutatea.</div></div>`;
}
function line(pts,stroke,fill){
  const W=300,H=110,P=6;
  const vs=pts.map(p=>p.v), mn=Math.min(...vs), mx=Math.max(...vs), sp=(mx-mn)||1;
  const X=i=>P+i*(W-2*P)/(pts.length-1), Y=v=>H-P-((v-mn)/sp)*(H-2*P);
  const d=pts.map((p,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(p.v).toFixed(1)).join(" ");
  return {mn,mx,svg:`<svg class="ch" viewBox="0 0 ${W} ${H+8}" preserveAspectRatio="none" role="img" aria-label="Grafic">
    <defs><linearGradient id="g${stroke.slice(1)}" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="${fill}" stop-opacity=".55"/>

function chartEx(exId){
  const ser=exSeries(exId);
  if(ser.length<2) return `<div class="hint" style="padding:26px 10px">Un singur punct deocamdată — linia apare după a doua sesiune.</div>`;
  const valOf=progMetric==="weight"?(x=>x.topKg):progMetric==="vol"?(x=>x.vol):(x=>x.e1rm);
  const col=progMetric==="weight"?["#536583","#E79DC3"]:progMetric==="vol"?["#3f8f7a","#9ACFB4"]:["#B4587C","#E79DC3"];
  const pts=ser.map(x=>({d:x.date,v:valOf(x)}));
  const c=line(pts,col[0],col[1]);
  const base=valOf(ser[0]), now=valOf(ser[ser.length-1]);
  const gain=base?Math.round((now-base)/base*100):0;
  const fmtv=v=>progMetric==="vol"?vol1(v):fmt(v)+" kg";
  return c.svg+`<div style="display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);padding:8px 2px 4px">
    <span>${new Date(ser[0].date+"T12:00:00").toLocaleDateString("ro-RO",{day:"numeric",month:"short"})}: ${fmtv(base)}</span>
    <span style="color:var(--pink-d);font-weight:700">acum ${fmtv(now)}${base?` · ${gain>=0?"+":""}${gain}%`:""}</span></div>`;
}

async function loadGroup(force){
  if(LB!==null&&!force) return;
  try{
    const [lb,ch]=await Promise.all([
      sb.from("leaderboard").select("*"),
      sb.from("challenges").select("*").order("ends")]);
    if(lb.error) throw lb.error;
    LB=lb.data||[]; CH=ch.data||[];
    const pr=await sb.from("challenge_progress").select("*");
    CHP=pr.data||[];
  }catch(e){
    LB=LB||[]; CH=CH||[]; CHP=CHP||[];

    authBusy=true; authMsg=null; render();
    try{
      if(A==="signin"){
        const {error}=await sb.auth.signInWithPassword({email:mail,password:pass});
        if(error) throw error;
      }else{
        const {data,error}=await sb.auth.signUp({email:mail,password:pass,options:{data:{name:nm}}});
        if(error) throw error;
        if(!data.session){ authBusy=false; authMode="in";
          authMsg={k:"ok",t:"Ți-am trimis un email de confirmare. Confirmă, apoi intră în cont."}; render(); return; }
      }
    }catch(e){
      authBusy=false;
      const m=(e&&e.message||"").toLowerCase();
      authMsg={k:"err",t: m.includes("invalid login")?"Email sau parolă greșită."
        : m.includes("already registered")||m.includes("already been")?"Există deja un cont cu emailul ăsta."
        : m.includes("confirm")?"Confirmă întâi emailul."
        : (e.message||"Ceva n-a mers. Încearcă din nou.")};
      render(); return;
    }
    authBusy=false; return;
  }
  if(A==="reset"){
    const mail=(document.getElementById("a-mail").value||"").trim();
    if(!mail){ authMsg={k:"err",t:"Scrie întâi emailul, apoi apasă din nou."}; render(); return; }
    await sb.auth.resetPasswordForEmail(mail,{redirectTo:location.href});
    authMsg={k:"ok",t:"Ți-am trimis un link de resetare pe email."}; render(); return;
  }
  if(A==="signout"){ await sb.auth.signOut(); me=null; S=null; tab="log"; authBusy=false; authMode="in"; render(); return; }

  if(!me) return;

  /* --- sesiune --- */
  if(A==="start"){ S.active={id:uid(),date:today(),started:Date.now(),items:[]}; pushProfile(); render(); sheetAddEx(); return; }
  if(A==="addex"){ sheetAddEx(); return; }
  if(A==="useex"||A==="createex"){
    let id=b.dataset.id;
    if(A==="createex"){ const e={id:uid(),name:b.dataset.nm,group:"Altele",ref:[]}; S.ex.push(e); pushEx(e); id=e.id; }
    if(!S.active) S.active={id:uid(),date:today(),started:Date.now(),items:[]};
    const ld=lastDone(id);
    S.active.items.push({id:uid(),exId:id,steps:ld?ld.steps.map(s=>({kg:s.kg,reps:[]})):[{kg:10,reps:[]}]});
    sel=null; close(); pushProfile(); render();
    scrollTo({top:document.body.scrollHeight,behavior:"smooth"}); return;
  }
  if(A==="addstep"){ const it=S.active.items[i];
    it.steps.push({kg:(it.steps.length?it.steps[it.steps.length-1].kg:10)+5,reps:[]}); pushProfile(); render(); return; }
  if(A==="kg+"||A==="kg-"){ const st=S.active.items[i].steps[si];
    st.kg=Math.max(0,Math.round((st.kg+(A==="kg+"?2.5:-2.5))*10)/10); buzz(8); pushProfile(); render(); return; }
  if(A==="kgset"){ sel={i,s:si,r:null};
    sheet("Greutate",`<input class="srch" id="kgv" inputmode="decimal" value="${fmt(S.active.items[i].steps[si].kg)}">
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
      ${[2.5,5,10,20].map(v=>`<button class="chip" style="min-width:68px;font-family:var(--body);font-size:14px" data-act="kgq" data-v="${v}">+${v}</button>`).join("")}</div>
      <button class="btn" data-act="kgok">Gata</button><div style="height:8px"></div>`,true); return; }
  if(A==="kgq"){ const inp=document.getElementById("kgv");
    inp.value=fmt((numRO(inp.value)||0)+parseFloat(b.dataset.v)); return; }
  if(A==="kgok"){ const v=numRO(document.getElementById("kgv").value);
    if(v!=null&&sel) S.active.items[sel.i].steps[sel.s].kg=Math.max(0,v);
    sel=null; close(); pushProfile(); render(); return; }
  if(A==="addset"){
    const st=S.active.items[i].steps[si];
    const ld=lastDone(S.active.items[i].exId);
    const prev=st.reps.length?st.reps[st.reps.length-1]
      :(ld&&ld.steps[si]&&ld.steps[si].reps.length?ld.steps[si].reps[0]:10);
    st.reps.push(prev); sel={i,s:si,r:st.reps.length-1};
    buzz(14); startRest(); pushProfile(); render(); return; }
  if(A==="pick"){ const r=+b.dataset.r;
    sel=(sel&&sel.i===i&&sel.s===si&&sel.r===r)?null:{i,s:si,r}; render(); return; }
  if(A==="rep+"||A==="rep-"){ const st=S.active.items[sel.i].steps[sel.s];
    st.reps[sel.r]=Math.max(1,Math.min(99,st.reps[sel.r]+(A==="rep+"?1:-1))); buzz(6); pushProfile(); render(); return; }
  if(A==="repdel"){ const st=S.active.items[sel.i].steps[sel.s];
    st.reps.splice(sel.r,1); sel=null; pushProfile(); render(); return; }
  if(A==="exmenu"){ sheet(nameOf(S.active.items[i]),
    `<button class="pick" data-act="tut" data-id="${S.active.items[i].exId}">
       <div style="flex:1"><div class="nm">Cum se face? Caută pe TikTok</div></div></button>
     <button class="pick" data-act="delstep" data-i="${i}"><div style="flex:1"><div class="nm">Șterge ultima treaptă</div></div></button>
     <button class="pick" data-act="delex" data-i="${i}"><div style="flex:1"><div class="nm" style="color:var(--pink-d)">Scoate din sesiune</div></div></button>`); return; }
  if(A==="delstep"){ const it=S.active.items[i]; if(it.steps.length>1) it.steps.pop(); close(); pushProfile(); render(); return; }
  if(A==="delex"){ S.active.items.splice(i,1); sel=null; close(); pushProfile(); render(); return; }
  if(A==="finish"){
    const a=S.active;
    a.items=a.items.filter(it=>it.steps.some(s=>s.reps.length));
    a.items.forEach(it=>{ it.steps=it.steps.filter(s=>s.reps.length); });
    if(!a.items.length){ S.active=null; pushProfile(); render(); toast("Sesiune goală — nesalvată"); return; }
    a.min=Math.max(1,Math.round((Date.now()-(a.started||Date.now()))/6e4));
    const recs=a.items.filter(it=>Math.max(...it.steps.map(s=>s.kg))>best(it.exId,a.id)).length;
    a.items.forEach(it=>{ const e=exOf(it.exId);
      if(e){ e.ref=it.steps.map(s=>({kg:s.kg,reps:s.reps.slice()})); pushEx(e); } });
    S.sessions.push({id:a.id,date:a.date,min:a.min,items:a.items});
    pushSession({id:a.id,date:a.date,min:a.min,items:a.items});
    S.active=null; sel=null; pushProfile(); stopRest(); tab="hist"; render();
    toast(recs?`Salvat · ${recs} record${recs>1?"uri noi":" nou"} ★`:"Antrenament salvat"); return;
  }
  if(A==="rest+"){ rest.left+=30; if(!rest.on||rest.left===30){ rest.on=true; clearInterval(restT);
    restT=setInterval(()=>{ rest.left--; if(rest.left<=0){rest.left=0;clearInterval(restT);buzz([90,70,90]);beep();} renderDock(); },1000); }
    renderDock(); return; }
  if(A==="restoff"){ stopRest(); return; }

  /* --- istoric --- */
  if(A==="sessmenu"){ sheet("Sesiune",
    `<button class="pick" data-act="delsess" data-id="${b.dataset.id}"><div style="flex:1"><div class="nm" style="color:var(--pink-d)">Șterge sesiunea</div></div></button>`); return; }
  if(A==="delsess"){ const id=b.dataset.id; S.sessions=S.sessions.filter(s=>s.id!==id);
    run(()=>sb.from("sessions").delete().eq("id",id)); close(); render(); return; }

  /* --- progres --- */
  if(A==="pickprog"){ const used=S.ex.filter(e=>S.sessions.some(s=>s.items.some(x=>x.exId===e.id)));
    sheet("Alege exercițiul",used.map(e=>`<button class="pick" data-act="setprog" data-id="${e.id}">
      <div style="flex:1;min-width:0"><div class="nm">${esc(e.name)}</div><div class="mt">record ${fmt(best(e.id))} kg</div></div>
      <span class="go">›</span></button>`).join("")); return; }
  if(A==="setprog"){ S.progEx=b.dataset.id; close(); pushProfile(); render(); return; }
  if(A==="progper"){ progPer=b.dataset.v; render(); return; }
  if(A==="progmet"){ progMetric=b.dataset.v; render(); return; }

  /* --- exerciții --- */
  if(A==="exinfo"){ const e=exOf(b.dataset.id), ld=lastDone(e.id);
    sheet(e.name,`<div class="card" style="margin-bottom:12px"><div class="sess">
        <div class="m">Grupă: ${esc(e.group)}</div><div class="m">Record: ${fmt(best(e.id))} kg</div>
        <div class="m">Ultima dată: ${ld?esc(stepsText(ld.steps)):"—"}</div></div></div>
      <button class="btn" data-act="tut" data-id="${e.id}" style="margin-bottom:9px">Cum se face? Caută pe TikTok</button>
      <button class="btn ghost" data-act="useex" data-id="${e.id}" style="margin-bottom:9px">Adaugă în sesiune</button>
      <button class="btn danger" data-act="delexlib" data-id="${e.id}">Șterge din listă</button><div style="height:8px"></div>`); return; }
  if(A==="delexlib"){ const id=b.dataset.id; S.ex=S.ex.filter(x=>x.id!==id);
    run(()=>sb.from("exercises").delete().eq("id",id)); close(); render(); return; }
  if(A==="newex"){ sheet("Exercițiu nou",
    `<input class="srch" id="nn" placeholder="Nume"><div class="grouplbl">Grupă</div>
     <div id="gsel">${GROUPS.map(g=>`<button class="chip" style="min-width:auto;padding:0 13px;height:38px;font-family:var(--body);font-size:13.5px;font-weight:600;margin:0 6px 6px 0" data-act="gpick" data-g="${g}">${g}</button>`).join("")}</div>
     <div style="height:10px"></div><button class="btn" data-act="saveex">Salvează</button><div style="height:8px"></div>`,true);
    window._g="Altele"; return; }
  if(A==="gpick"){ window._g=b.dataset.g;
    document.querySelectorAll("#gsel .chip").forEach(c=>c.classList.toggle("on",c.dataset.g===window._g)); return; }
  if(A==="saveex"){ const n=document.getElementById("nn").value.trim();
    if(!n){ toast("Scrie un nume"); return; }
    const e={id:uid(),name:n,group:window._g||"Altele",ref:[]}; S.ex.push(e); pushEx(e); close(); render(); return; }


  /* --- grup --- */
  if(A==="gsub"){ gsub=b.dataset.v; render(); return; }
  if(A==="lbper"){ LBper=b.dataset.v; render(); return; }
  if(A==="chnew"){
    window._cm="sessions"; window._cd=30;
    sheet("Provocare nouă",
      `<input class="srch" id="cn" placeholder="Nume, ex. Ianuarie fără scuze">
       <div class="grouplbl">Se numără</div>
       <div id="csel" style="display:flex;gap:8px;margin-bottom:6px">
         <button class="chip on" style="flex:1;min-width:auto;font-family:var(--body);font-size:13.5px;font-weight:700" data-act="cmet" data-v="sessions">Antrenamente</button>
         <button class="chip" style="flex:1;min-width:auto;font-family:var(--body);font-size:13.5px;font-weight:700" data-act="cmet" data-v="volume">Kilograme ridicate</button></div>
       <div class="grouplbl">Obiectiv</div>
       <input class="srch" id="cg" inputmode="decimal" value="12">
       <div class="grouplbl">Pe câte zile</div>
       <div id="dsel" style="display:flex;gap:8px;margin-bottom:14px">
         ${[7,14,30,60].map(d=>`<button class="chip ${d===30?"on":""}" style="flex:1;min-width:auto;font-family:var(--body);font-size:13.5px;font-weight:700" data-act="cdur" data-v="${d}">${d}</button>`).join("")}</div>
       <button class="btn" data-act="chcreate">Creează</button><div style="height:8px"></div>`,true);
    return; }
  if(A==="cmet"){ window._cm=b.dataset.v;
    document.querySelectorAll("#csel .chip").forEach(c=>c.classList.toggle("on",c.dataset.v===window._cm));
    const g=document.getElementById("cg"); if(g) g.value=window._cm==="volume"?"20000":"12"; return; }
  if(A==="cdur"){ window._cd=+b.dataset.v;
    document.querySelectorAll("#dsel .chip").forEach(c=>c.classList.toggle("on",+c.dataset.v===window._cd)); return; }
  if(A==="chcreate"){
    const nm=document.getElementById("cn").value.trim(), goal=numRO(document.getElementById("cg").value);
    if(!nm||!goal){ toast("Nume și obiectiv, te rog"); return; }
    const end=new Date(); end.setDate(end.getDate()+(window._cd||30));
    const c={id:uid(), code:Math.random().toString(36).slice(2,7).toUpperCase(),
      name:nm, metric:window._cm||"sessions", goal:goal, starts:today(),
      ends:new Date(end.getTime()-end.getTimezoneOffset()*6e4).toISOString().slice(0,10),
      created_by:me.id};
    close();
    const r=await sb.from("challenges").insert(c);
    if(r.error){ toast("N-a mers: "+r.error.message); return; }
    await sb.from("challenge_members").insert({challenge_id:c.id,user_id:me.id});
    await loadGroup(true); gsub="ch"; render(); toast("Gata · cod "+c.code); return; }
  if(A==="chjoin"){ sheet("Intru într-o provocare",
    `<input class="srch" id="cc" placeholder="Codul, ex. K7P2M" autocomplete="off"
       style="text-transform:uppercase;letter-spacing:.1em;font-weight:800">
     <button class="btn" data-act="chjoingo">Intru</button><div style="height:8px"></div>`,true); return; }
  if(A==="chjoingo"){
    const code=(document.getElementById("cc").value||"").trim();
    if(!code) return;
    close();
    const r=await sb.rpc("join_challenge",{p_code:code});
    if(r.error){ toast("Codul nu există"); return; }
    await loadGroup(true); gsub="ch"; render(); toast("Ai intrat"); return; }
  if(A==="chleave"){
    const id=b.dataset.id, c=(CH||[]).find(x=>x.id===id);
    if(c&&c.created_by===me.id) await sb.from("challenges").delete().eq("id",id);
    else await sb.from("challenge_members").delete().eq("challenge_id",id).eq("user_id",me.id);
    await loadGroup(true); render(); return; }
  if(A==="visible"){ S.me.visible=S.me.visible===false; pushProfile(); LB=null; render(); return; }

  /* --- tutorial --- */
  if(A==="tut"){ sheetTutorial(b.dataset.id); return; }
  if(A==="savetut"){
    const e=exOf(b.dataset.id); if(e){ e.search=document.getElementById("tq").value.trim(); pushEx(e); }
    close(); render(); toast("Salvat"); return; }
  if(A==="lib"){ sheet("Exercițiile mele", viewLib()); return; }
  /* --- profil --- */
  if(A==="edit"){ sheetEdit(b.dataset.f); return; }
  if(A==="savefield"){
    const f=b.dataset.f, raw=document.getElementById("fv").value.trim();
    if(f==="name"||f==="gym") S.me[f]=raw;
    else if(f==="born") S.me.born=raw||null;
    else { const v=numRO(raw); S.me[f]=v; if(f==="goal") S.me.goal=Math.max(1,Math.min(14,Math.round(v||3)));
      if(f==="rest") S.me.rest=Math.max(10,Math.min(600,Math.round(v||90))); }
    close(); pushProfile(); render(); return; }
  if(A==="avatar"){ sheet("Poza de profil",
    `<div class="avpick">${AVATARS.map(a=>`<button data-act="setav" data-v="${a}" class="${S.me.avatar&&S.me.avatar.v===a?"on":""}">${a}</button>`).join("")}</div>
     <button class="btn ghost" data-act="photo">Încarcă o poză</button><div style="height:8px"></div>`); return; }
  if(A==="setav"){ S.me.avatar={t:"e",v:b.dataset.v}; close(); pushProfile(); render(); return; }
  if(A==="photo"){
    const inp=document.createElement("input"); inp.type="file"; inp.accept="image/*";
    inp.onchange=()=>{ const f=inp.files[0]; if(!f) return;
      const rd=new FileReader();
      rd.onload=()=>{ const im=new Image();
        im.onload=()=>{ const c=document.createElement("canvas"); c.width=c.height=220;
          const s=Math.min(im.width,im.height), x=c.getContext("2d");
          x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,220,220);
          S.me.avatar={t:"i",v:c.toDataURL("image/jpeg",.8)}; close(); pushProfile(); render(); };
        im.src=rd.result; };
      rd.readAsDataURL(f); };
    inp.click(); return; }
  if(A==="addbody"){ sheet("Cântărire",
    `<input class="srch" id="bw" inputmode="decimal" placeholder="kg"
       value="${S.body.length?fmt(S.body[S.body.length-1].kg):""}">
     <button class="btn" data-act="savebody">Salvează</button><div style="height:8px"></div>`,true); return; }
  if(A==="savebody"){ const v=numRO(document.getElementById("bw").value);
    if(v==null){ toast("Scrie o valoare"); return; }
    const rec={id:uid(),date:today(),kg:v};
    S.body=S.body.filter(x=>x.date!==rec.date); S.body.push(rec);
    S.body.sort((a,c)=>a.date<c.date?-1:1);
    pushBody(rec); close(); render(); return; }
  if(A==="delbody"){ const last=S.body.pop(); if(last) run(()=>sb.from("body_log").delete().eq("id",last.id));
    render(); return; }
  if(A==="export"){
    const blob=new Blob([JSON.stringify({profil:S.me,exercitii:S.ex,sesiuni:S.sessions,greutate:S.body},null,1)],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download="sala-"+today()+".json"; a.click(); toast("Fișier descărcat"); return; }
});

/* ═══════════════════════════════════════════════════════════════════════
   10. Pornire
   ═══════════════════════════════════════════════════════════════════════ */
let booting=false;
async function enter(user){
  if(booting) return; booting=true; authBusy=false; authMsg=null;
  me=user;
  try{ await loadAll(); }catch(e){ toast("Nu am putut încărca datele — verifică conexiunea"); }
  tab="log"; render(); booting=false;
}
(async()=>{
  if(SUPABASE_URL.indexOf("PUNE_AICI")===0||SUPABASE_ANON_KEY.indexOf("PUNE_AICI")===0){ viewSetup(); return; }
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  /* apelurile către bază nu se fac direct în callback — de aici setTimeout */
  sb.auth.onAuthStateChange((evt,session)=>{
    if(session&&session.user){
      if(me&&me.id===session.user.id) return;
      setTimeout(()=>enter(session.user),0);
    }else if(evt==="SIGNED_OUT"){ me=null; S=null; authBusy=false; render(); }
  });
  render();
  const {data}=await sb.auth.getSession();
  if(data&&data.session&&!me&&!booting) enter(data.session.user);
})();
</script>
